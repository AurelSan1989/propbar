<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gabarit de l'image de partage</title>
<!--
    Gabarit servant à produire img/partage.jpg (l'aperçu affiché quand le lien
    du site est envoyé sur WhatsApp, Facebook, Messenger...). Ne fait pas
    partie du site publié : il est rendu une fois, capturé en 1200x630, et le
    résultat seul est mis en ligne.

    Pour refaire l'image après un changement de photo ou de texte, ouvrir ce
    fichier à exactement 1200x630 et capturer la page.
-->
<style>
    @font-face {
        font-family: "Fraunces";
        src: url("../fonts/fraunces-700.woff2") format("woff2");
        font-weight: 700;
    }
    @font-face {
        font-family: "Archivo";
        src: url("../fonts/archivo-400.woff2") format("woff2");
        font-weight: 400;
    }
    @font-face {
        font-family: "Archivo";
        src: url("../fonts/archivo-600.woff2") format("woff2");
        font-weight: 600;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background-color: #0C1A14;
    }

    .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Photo verticale : cadrage choisi pour garder l'enseigne
           « L'IMPOND' » en haut de l'image et la banderole au-dessus du texte. */
        object-position: center 38%;
    }

    /* Voile dégradé : la photo reste lisible en haut, le texte détaché en bas. */
    .voile {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom,
            rgba(18, 14, 10, 0.15) 0%,
            rgba(18, 14, 10, 0.70) 50%,
            rgba(18, 14, 10, 0.94) 100%);
    }

    /* Composition centrée : WhatsApp recadre souvent l'aperçu en carré
       (630 × 630 au centre de l'image). Tout le texte doit tenir dans ce
       carré, sans quoi le début du nom est coupé. */
    .contenu {
        position: absolute;
        left: 300px;
        right: 300px;
        bottom: 52px;
        text-align: center;
    }

    .eyebrow {
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #F2C9A0;
        margin-bottom: 14px;
    }

    h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 76px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #FBF6EE;
        margin-bottom: 18px;
    }

    .infos {
        font-family: "Archivo", sans-serif;
        font-size: 22px;
        line-height: 1.5;
        color: #EFE7DA;
    }

    /* Filet d'accent, repris de l'identité du site. */
    .filet {
        width: 96px;
        height: 5px;
        background-color: #C8301E;
        margin: 0 auto 20px;
    }
</style>
</head>
<body>
    <img class="photo" src="../img/devanture.webp" alt="">
    <div class="voile"></div>
    <div class="contenu">
        <div class="filet"></div>
        <p class="eyebrow">Bar restaurant · Paris 20<sup>e</sup></p>
        <h1>L'impondérable</h1>
        <p class="infos">
            Terrasse toute l'année · Happy Hour 16h – 2h<br>
            320 rue des Pyrénées · Métro Jourdain
        </p>
    </div>
</body>
</html>
